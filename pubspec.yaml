name: fleet_calculator
description: Fleet Calculator AMM Jobsite KPC-BGE
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  http: ^1.1.0
  intl: ^0.18.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: "^0.14.3"  # Ditambahkan
  rename_app: ^1.3.1
  flutter_post_build: ^1.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.jpeg
  fonts:
      - family: Roboto
        fonts:
          - asset: assets/fonts/Roboto-Regular.ttf
          - asset: assets/fonts/Roboto-Medium.ttf
            weight: 500
          - asset: assets/fonts/Roboto-Bold.ttf
            weight: 700
          - asset: assets/fonts/Roboto-Italic.ttf
            style: italic

flutter_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/logo.jpeg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.jpeg"


flutter_post_builder:
  package_name: "fleet_calculator"  # Nama dasar untuk file APK
  append_version: true               # Otomatis menambahkan versi
  final_directory: "./release"       # Folder output